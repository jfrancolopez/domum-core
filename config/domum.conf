# domum-core configuration
# This file is sourced by bash. Keep it simple.

# Your base domain
DOMUM_DOMAIN="ladomum.com"

# ACME email for certificates
DOMUM_EMAIL="jfranco.lopez@outlook.com"

# Optional: helpful for documentation, not required
DOMUM_LAN_IP="10.0.10.2"
DOMUM_TS_IP=""

# Enable core proxy
ENABLE_TRAEFIK=1

# Automation stack
ENABLE_HOME_ASSISTANT=1
ENABLE_MARIADB=1
ENABLE_GO2RTC=1
ENABLE_FRIGATE=0 #causing crashes, leave it outside of rpi
ENABLE_MQTT=1
ENABLE_ZIGBEE2MQTT=1
ENABLE_ZWAVE=1
ENABLE_NODERED=1
ENABLE_ESP_HOME=1
ENABLE_MA=1

# Monitoring
ENABLE_UPTIME_KUMA=0
ENABLE_PORTAINER=1

# Media
ENABLE_JELLYFIN=0

# Networking
ENABLE_ADGUARD_HOME=1

# Productivity
ENABLE_ACTUAL_BUDGET=1

# Security
ENABLE_TAILSCALE=0 #added manually by CLI 

# Profiles
# core is always enabled
ENABLE_NIGHT_PROFILE=0
ENABLE_MEDIA_PROFILE=0
ENABLE_AI_PROFILE=0

# Night schedule (systemd timers)
NIGHT_UP_TIME="00:00"
NIGHT_DOWN_TIME="06:00"

# If enabled, domum apply will stop night-only containers when outside the window.
# Scheduling is still handled by systemd timers.
NIGHT_AUTOSTOP_OUTSIDE_WINDOW=1

# ============================================================
# Production management (backup / recovery / updates / checkup)
# ============================================================
# Detailed backup, recovery-pack, and update settings live in the overlay file
# config/domum-backup.conf (copied from .example by `domum-core init`). The
# settings below are safe additive defaults; override here if you prefer to keep
# everything in one file.

# Runtime + log roots (created mode 0750 by the CLI; nothing under /var is in git).
STATE_ROOT="/var/lib/domum-core"
LOG_DIR="/var/log/domum-core"

# Backup freshness gate (hours). checkup flags stale backups; stateful (Class
# B/C) updates refuse without a backup newer than this unless --force.
BACKUP_MAX_AGE_HOURS=48

# Recovery pack (AGE-encrypted). Generation is on; the AGE keypair must be
# created manually and email delivery is off — see config/domum-backup.conf.
RECOVERY_PACK_ENABLED=1
RECOVERY_PACK_REMINDER_DAYS=30

# Update risk classes (see `domum-core updates`). Class D = host OS (apt).
UPDATE_CLASS_A="traefik adguard-home uptime-kuma portainer tailscale"
UPDATE_CLASS_B="home-assistant mariadb mqtt zigbee2mqtt zwave-js-ui nodered esphome"
UPDATE_CLASS_C="actual-budget music-assistant jellyfin"
