title = "domum-core gitleaks config"

[extend]
useDefault = true

# Until the Zigbee network key is rotated (tracked separately), the historical
# committed key in zigbee2mqtt/configuration.yaml would block CI. The plaintext
# value has since been replaced with `!secret network_key` indirection (fix #5),
# but git history still contains the raw bytes. Allowlist the path so historical
# scans pass; rotation is a separate operational task.
[allowlist]
description = "Historical Zigbee network key (rotation tracked separately)"
paths = [
  '''compose/automation/zigbee2mqtt/configuration\.yaml''',
]
