services:
  mariadb:
    # Pinned to the datadir's version (mariadb_upgrade_info: 12.2.2) after the
    # 2026-07-10 :latest→12.3 crash-loop incident. Bump deliberately only:
    # fresh dump -> set MARIADB_AUTO_UPGRADE=1 in the env file -> move pin ->
    # apply -> verify. See backlog/task-10-pin-critical-images.md.
    image: ${MARIADB_IMAGE:-mariadb:12.2}
    container_name: mariadb
    restart: unless-stopped
    # MariaDB can exceed compose's default 10s stop timeout; SIGKILL mid-write
    # is what corrupted tc.log during the incident.
    stop_grace_period: 1m

    # Keep it off the public proxy network.
    # We'll use a dedicated internal network so HA and future Grafana can reach it.
    networks:
      - domum-data

    # Credentials live outside the repo (matches your pattern).
    env_file:
      - ${DOMUM_MARIADB_ENV_FILE:-/etc/domum-core/secrets/mariadb/mariadb.env}

    command:
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
      - --innodb-file-per-table=1
      - --skip-name-resolve=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - /opt/domum-core/compose/automation/mariadb/data:/var/lib/mysql
      - /opt/domum-core/compose/automation/mariadb/conf.d:/etc/mysql/conf.d

    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

    profiles:
      - core

networks:
  domum-data:
    external: true
