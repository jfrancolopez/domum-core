services:
  glance:
    image: ${GLANCE_IMAGE:-glanceapp/glance:v0.8.5}
    container_name: glance
    restart: unless-stopped
    command:
      - --config
      - /app/config/glance.yaml
    networks:
      - domum-proxy
    environment:
      - TZ=America/New_York
      - DOMUM_DOMAIN=${DOMUM_DOMAIN}
      - ADGUARD_WEB_PORT=${ADGUARD_WEB_PORT:-3000}
    env_file:
      - path: /etc/domum-core/secrets/glance-beszel.env
        required: false
    volumes:
      - /opt/domum-core/compose/monitoring/glance:/app/config:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=domum-proxy
      - traefik.http.routers.glance.rule=Host(`dash.${DOMUM_DOMAIN}`)
      - traefik.http.routers.glance.entrypoints=websecure
      - traefik.http.routers.glance.tls=true
      - traefik.http.routers.glance.tls.certresolver=cf
      - traefik.http.middlewares.glance-private.ipallowlist.sourcerange=${DOMUM_GLANCE_LAN_CIDR},100.64.0.0/10
      - traefik.http.routers.glance.middlewares=glance-private@docker,glanceEmbedHeaders@file
      - traefik.http.services.glance.loadbalancer.server.port=8080
    profiles:
      - core

networks:
  domum-proxy:
    external: true
