services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    networks:
      - domum-proxy
      - domum-data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - APP_URL=https://speedtest.${DOMUM_DOMAIN}
    env_file:
      - ${DOMUM_SPEEDTEST_ENV_FILE:-/opt/domum-core/config/speedtest-tracker.env}
    volumes:
      - /opt/domum-core/compose/monitoring/speedtest-tracker/data:/config
    labels:
      - traefik.enable=true
      - traefik.docker.network=domum-proxy
      - traefik.http.routers.speedtest.rule=Host(`speedtest.${DOMUM_DOMAIN}`)
      - traefik.http.routers.speedtest.entrypoints=websecure
      - traefik.http.routers.speedtest.tls=true
      - traefik.http.routers.speedtest.tls.certresolver=cf
      - traefik.http.routers.speedtest.middlewares=securityHeaders@file
      - traefik.http.services.speedtest.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://127.0.0.1:80/api/healthcheck || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 90s
    profiles:
      - core

networks:
  domum-proxy:
    external: true
  domum-data:
    external: true
