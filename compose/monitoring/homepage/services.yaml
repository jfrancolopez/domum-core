- Home Automation:
    - Home Assistant:
        href: https://ha.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Home control hub
        icon: home-assistant.png
        siteMonitor: http://homeassistant:8123
    - Zigbee2MQTT:
        href: https://z2m.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Zigbee device bridge
        icon: zigbee2mqtt.png
        siteMonitor: http://zigbee2mqtt:8080
    - Z-Wave JS UI:
        href: https://zwave.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Z-Wave device bridge
        icon: zwave-js-ui.png
        siteMonitor: http://zwave-js-ui:8091
    - Node-RED:
        href: https://nodered.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Flow runtime and deploy surface
        icon: node-red.png
        siteMonitor: http://nodered:1880
        widget:
          type: customapi
          url: http://nodered:1880/flows
          refreshInterval: 30000
          mappings:
            - label: Flows
              format: size
    - ESPHome:
        href: https://esphome.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: ESP device fleet
        icon: esphome.png
        siteMonitor: http://esphome:6052
        widget:
          type: esphome
          url: http://esphome:6052
          fields: ["total", "online", "offline_alt", "unknown"]
    - Music Assistant:
        href: https://ma.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
