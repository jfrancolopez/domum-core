- Glance:
    - Glance Daily Overview:
        href: https://glance.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Embedded live feeds and release radar
        icon: glance.png
        widget:
          type: iframe
          name: Glance
          src: https://glance.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
          classes: h-screen
          referrerPolicy: same-origin
          allowScrolling: "yes"
          loadingStrategy: eager

- Core Status:
    - domum-core:
        href: https://cockpit.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: "RPi 5 host console: CPU, RAM, temp, uptime, storage"
        icon: mdi-server
    - Beszel Live Metrics:
        href: https://beszel.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Host, container, disk, network, and alert history
        icon: beszel.png
        siteMonitor: http://beszel:8090
    - Backups:
        href: https://checks.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
