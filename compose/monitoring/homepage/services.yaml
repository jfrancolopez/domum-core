- Glance:
    - Glance Daily Overview:
        href: https://glance.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Embedded Glance feed; direct link remains available if framing fails
        icon: glance.png
        widget:
          type: iframe
          name: Glance
          src: https://glance.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
          classes: h-screen
          referrerPolicy: same-origin
          allowScrolling: "yes"
          loadingStrategy: eager

- Core Status:
    - domum-core:
        href: https://cockpit.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Pi console and recovery shell
        icon: mdi-server
        siteMonitor: https://home.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
    - Beszel Live Metrics:
        href: https://beszel.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Live host and container metrics
        icon: beszel.png
        siteMonitor: http://beszel:8090
        widget:
          type: beszel
          url: http://beszel:8090
          username: "{{HOMEPAGE_VAR_BESZEL_USERNAME}}"
          password: "{{HOMEPAGE_VAR_BESZEL_PASSWORD}}"
          version: 2
          fields: ["systems", "up"]
    - Backups:
        href: https://checks.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Backup checks need an API key
        icon: mdi-cloud-sync
    - Healthchecks:
        href: https://checks.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Scheduled job monitor
        icon: healthchecks.png

- Network:
    - UniFi Network:
        href: https://unifi
        description: Gateway and client console
        icon: unifi.png
    - AdGuard Home:
        href: https://dns.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: DNS and blocking stats
        icon: adguard-home.png
        siteMonitor: http://adguard-home
        widget:
          type: adguard
          url: http://adguard-home
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
          fields: ["queries", "blocked", "filtered", "latency"]
    - Traefik:
        href: https://traefik.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Router, service, and middleware health
        icon: traefik.png
        widget:
          type: traefik
          url: https://traefik.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
          username: "{{HOMEPAGE_VAR_TRAEFIK_USERNAME}}"
          password: "{{HOMEPAGE_VAR_TRAEFIK_PASSWORD}}"
          fields: ["routers", "services", "middleware"]
    - Speedtest:
        href: https://beszel.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Not configured yet
        icon: mdi-speedometer
    - Healthchecks:
        href: https://checks.{{HOMEPAGE_VAR_DOMUM_DOMAIN}}
        description: Live totals need an API key
        icon: healthchecks.png

- Calendar:
    - Gmail Calendar:
        href: https://calendar.google.com/calendar/u/0/r?cid=jfrancolopez.dev@gmail.com
        description: Family month view
        icon: google-calendar.png
        widget:
          type: calendar
          firstDayInWeek: sunday
          view: monthly
          maxEvents: 4
          showTime: true
          timezone: America/New_York
          integrations:
            - type: ical
              url: "{{HOMEPAGE_VAR_GOOGLE_CALENDAR_ICAL_URL}}"
              name: Gmail
              color: violet
              params:
                showName: false

- Servers:
