- logo:
    icon: mdi-server
- resources:
    label: Homepage Runtime
    cpu: true
    memory: true
    cputemp: true
    units: metric
    refresh: 5000
- resources:
    label: Root NVMe
    disk: /domum-core
    expanded: true
    diskUnits: bytes
    refresh: 30000
- resources:
    label: Uptime
    uptime: true
    refresh: 30000
- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
- search:
    provider: google
    target: _self
    showSearchSuggestions: true
- openmeteo:
    label: Durham
    latitude: 35.994
    longitude: -78.8986
    timezone: America/New_York
    units: metric
    cache: 5
    format:
      maximumFractionDigits: 0
