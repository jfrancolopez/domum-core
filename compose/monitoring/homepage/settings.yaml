    style: row
    columns: 3
  Infrastructure Administration:
    tab: APPS
    style: row
    columns: 4
  Utilities:
    tab: APPS
    style: row
    columns: 3
  Security:
    tab: APPS
    style: row
    columns: 3
  Media Services:
    tab: MEDIA
    style: row
    columns: 3
  Media Infrastructure:
    tab: MEDIA
