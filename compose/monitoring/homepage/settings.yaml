title: domum-core
description: Home automation // observability portal
theme: dark
color: slate
target: _self
hideVersion: true
disableUpdateCheck: true
statusStyle: dot
headerStyle: boxedWidgets
iconStyle: theme
fullWidth: true
useEqualHeights: true
cardBlur: md
blockHighlights:
  levels:
    good: "bg-emerald-500/20 text-emerald-200 dark:bg-emerald-900/40 dark:text-emerald-200"
    warn: "bg-amber-400/20 text-amber-100 dark:bg-amber-900/45 dark:text-amber-100"
    danger: "bg-rose-500/25 text-rose-100 dark:bg-rose-950/60 dark:text-rose-100"
background:
  image: /images/domum-background.svg
  blur: sm
  saturate: 50
  brightness: 50
  opacity: 30
quicklaunch:
  searchDescriptions: true
  provider: google
  target: _blank
  mobileButtonPosition: bottom-right
layout:
  Core Status:
    tab: System
    style: row
    columns: 3
  Network:
    tab: System
    style: row
    columns: 3
  Calendar:
    tab: System
    style: row
    columns: 1
  Servers:
    tab: System
    style: row
    columns: 3
  Home Automation:
    tab: System
    style: row
    columns: 3
  Infrastructure:
    tab: Apps
    style: row
    columns: 4
  Applications:
    tab: Apps
    style: row
    columns: 3
  Security:
    tab: Apps
    style: row
    columns: 3
  Media Services:
    tab: Media
    style: row
    columns: 3
  Media Infrastructure:
    tab: Media
    style: row
    columns: 3
  Feed Bookmarks:
    tab: Feeds
    style: row
    columns: 4
  Glance:
    tab: Feeds
    style: row
    columns: 1
