title: domum-core
description: Raspberry Pi 5 · Domum control plane
theme: dark
color: slate
target: _self
hideVersion: true
disableUpdateCheck: true
statusStyle: dot
headerStyle: boxedWidgets
iconStyle: theme
fullWidth: true
useEqualHeights: true
cardBlur: md
blockHighlights:
  levels:
    good: "bg-emerald-500/20 text-emerald-200 dark:bg-emerald-900/40 dark:text-emerald-200"
    warn: "bg-amber-400/20 text-amber-100 dark:bg-amber-900/45 dark:text-amber-100"
    danger: "bg-rose-500/25 text-rose-100 dark:bg-rose-950/60 dark:text-rose-100"
background:
  image: https://homepage.ladomum.com/images/domum-background.svg
  blur: none
  saturate: 100
  brightness: 100
  opacity: 100
quicklaunch:
  searchDescriptions: true
  provider: google
  target: _blank
  mobileButtonPosition: bottom-right
layout:
  Core Status:
    tab: SYSTEM
    style: row
    columns: 4
  Servers:
    tab: SYSTEM
    style: row
    columns: 2
  Calendar:
    tab: SYSTEM
    style: row
    columns: 1
