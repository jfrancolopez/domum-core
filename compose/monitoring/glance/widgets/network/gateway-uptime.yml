# Gateway Uptime Tracking Widget

version: "1"
type: "network/gateway-uptime"  
title: "Gateway Uptime"
description: "Tracks gateway uptime metrics and availability"

config:
  # API endpoint for uptime data 
  api_endpoint: "/api/gateway/uptime"
  # Time range for uptime tracking (24h, 7d, 30d)
  time_range: "24h"
  
# Refresh interval (5 minutes)  
refresh: 5m

# Privacy classification - Public since this is basic availability info
privacy: "public"

# Data fields displayed
fields:
  - name: uptime_percentage_24h 
    label: "Uptime (24h)"
    type: "percentage"
  - name: uptime_percentage_7d  
    label: "Uptime (7d)"
    type: "percentage" 
  - name: uptime_percentage_30d
    label: "Uptime (30d)"
    type: "percentage"
  - name: last_reset
    label: "Last Reset"
    type: "datetime"