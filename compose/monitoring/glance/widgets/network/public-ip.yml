# Public IP and ISP Information Widget

version: "1"
type: "network/public-ip"
title: "Public IP and ISP Info"
description: "Displays public IP address, ISP information, and location data"

config:
  # External API endpoint for public IP lookup
  api_endpoint: "https://api.ipify.org?format=json" 
  # Additional endpoint to get ISP info  
  isp_api_endpoint: "https://ipapi.co/json/"
  
# Refresh interval (1 hour)
refresh: 1h

# Privacy classification - Public since this is basic network information
privacy: "public"

# Data fields displayed
fields:
  - name: ip_address
    label: "IP Address"
    type: "string" 
  - name: isp
    label: "ISP"
    type: "string"
  - name: location  
    label: "Location"
    type: "string"