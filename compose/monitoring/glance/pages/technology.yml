- name: Technology
  slug: technology
  width: wide
  show-mobile-header: true
  head-widgets:
    - type: html
      source: |
        <section class="domum-page-hero">
          <div>
            <div class="domum-kicker">Build radar</div>
            <h1>Technology Lab</h1>
            <p>Self-hosting, infrastructure, security, AI, and developer signals for improving the stack deliberately.</p>
          </div>
          <div class="domum-hero-badges">
            <span>Homelab</span>
            <span>Security</span>
            <span>AI + dev</span>
          </div>
        </section>
  columns:
    - size: full
      widgets:
        - type: videos
          title: Engineering videos
          style: horizontal-cards
          cache: 1h
          limit: 10
          collapse-after: 5
          include-shorts: false
          channels:
            - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
            - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
            - UCsBjURrPoezykLs9EqgamOA # Fireship
            - UCld68syR8Wi-GY_n4CaoJGA # ThePrimeTimeagen

        - type: split-column
          widgets:
            - type: rss
              title: Self-hosting and infrastructure
              style: vertical-list
              cache: 45m
              limit: 12
              collapse-after: 6
              feeds:
                - url: https://selfh.st/rss/
                  title: selfh.st
                - url: https://www.cncf.io/feed/
                  title: CNCF
                - url: https://www.docker.com/blog/feed/
                  title: Docker

            - type: rss
              title: Security and AI
              style: vertical-list
              cache: 45m
              limit: 12
              collapse-after: 6
              feeds:
                - url: https://www.bleepingcomputer.com/feed/
                  title: BleepingComputer
                - url: https://krebsonsecurity.com/feed/
                  title: Krebs
                - url: https://simonwillison.net/atom/everything/
                  title: Simon Willison

    - size: small
      widgets:
        - type: releases
          title: Stack releases
          cache: 6h
          limit: 8
          collapse-after: 5
          show-source-icon: true
          repositories:
            - home-assistant/core
            - traefik/traefik
            - gethomepage/homepage
            - glanceapp/glance
            - henrygd/beszel

        - type: repository
          title: Domum Core activity
          cache: 6h
          repository: jfrancolopez/domum-core
          pull-requests-limit: -1
          issues-limit: -1
          commits-limit: 4

        - type: bookmarks
          title: Open directly
          groups:
            - title: Watch and read
              links:
                - title: Hacker News
                  url: https://news.ycombinator.com/
                - title: Lobsters
                  url: https://lobste.rs/
                - title: selfh.st
                  url: https://selfh.st/
                - title: Jeff Geerling
                  url: https://www.youtube.com/@JeffGeerling
                - title: The Primeagen
                  url: https://www.youtube.com/@ThePrimeTimeagen
