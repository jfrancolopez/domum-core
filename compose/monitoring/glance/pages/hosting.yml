- name: Hosting
  width: wide
  columns:
    - size: full
      widgets:
        - type: monitor
          title: Critical services
          style: compact
          cache: 1m
          sites:
            - title: Homepage
              url: https://home.${DOMUM_DOMAIN}
              check-url: http://homepage:3000
              icon: si:homepage
            - title: Home Assistant
              url: https://ha.${DOMUM_DOMAIN}
              check-url: http://homeassistant:8123
              icon: si:homeassistant
            - title: Beszel
              url: https://beszel.${DOMUM_DOMAIN}
              check-url: http://beszel:8090
              icon: si:beszel
            - title: Zigbee2MQTT
              url: https://z2m.${DOMUM_DOMAIN}
              check-url: http://zigbee2mqtt:8080
              icon: si:zigbee
            - title: Node-RED
              url: https://nodered.${DOMUM_DOMAIN}
              check-url: http://nodered:1880
              icon: si:nodered