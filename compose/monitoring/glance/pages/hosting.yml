- name: Hosting
  slug: hosting
  width: wide
  show-mobile-header: true
  head-widgets:
    - type: html
      source: |
        <section class="domum-page-hero">
          <div>
            <div class="domum-kicker">Home infrastructure</div>
            <h1>Hosting Control</h1>
            <p>What needs attention, what is healthy, and where to drill into specialist tools.</p>
          </div>
          <div class="domum-hero-badges">
            <span>Core services</span>
            <span>Automation dependencies</span>
            <span>Fleet summary</span>
          </div>
        </section>
  columns:
    - size: small
      widgets:
        - type: bookmarks
          title: Investigate
          groups:
            - title: Specialist UIs
              links:
                - title: Beszel
                  url: https://beszel.${DOMUM_DOMAIN}
                - title: Healthchecks
                  url: https://checks.${DOMUM_DOMAIN}
                - title: Traefik
                  url: https://traefik.${DOMUM_DOMAIN}
                - title: Speedtest Tracker
                  url: https://speedtest.${DOMUM_DOMAIN}
            - title: Repository
              links:
                - title: domum-core
                  url: https://github.com/jfrancolopez/domum-core
                - title: Glance docs
                  url: https://github.com/glanceapp/glance/tree/v0.8.5/docs

    - size: full
      widgets:
        - type: html
          source: |
            <div class="domum-attention-strip">
              <div class="domum-attention-card">
                <strong>Watch</strong>
                <span>Any red or stale widget below needs action.</span>
              </div>
              <div class="domum-attention-card">
                <strong>Recover</strong>
                <span>Beszel, Healthchecks, and Traefik are the drill-down tools.</span>
              </div>
              <div class="domum-attention-card">
                <strong>Update</strong>
                <span>Release cards are signals, not auto-approval.</span>
              </div>
            </div>

        - type: monitor
          title: Core infrastructure
          style: compact
          cache: 1m
          sites:
            - title: Glance
              url: https://dash.${DOMUM_DOMAIN}
              check-url: http://glance:8080
              icon: si:glance
            - title: Homepage
              url: https://home.${DOMUM_DOMAIN}
              check-url: http://homepage:3000
              icon: si:homepage
            - title: Home Assistant
              url: https://ha.${DOMUM_DOMAIN}
              check-url: http://homeassistant:8123
              icon: si:homeassistant
            - title: Beszel
              url: https://beszel.${DOMUM_DOMAIN}
              check-url: http://beszel:8090
              icon: si:beszel
            - title: Healthchecks
              url: https://checks.${DOMUM_DOMAIN}
              check-url: http://healthchecks:8000
              icon: si:healthchecks
            - title: Speedtest Tracker
              url: https://speedtest.${DOMUM_DOMAIN}
              check-url: http://speedtest-tracker:80
              icon: si:speedtest

        - type: custom-api
          title: Beszel fleet
          title-url: https://beszel.${DOMUM_DOMAIN}
          cache: 5m
          url: http://glance-beszel-adapter:8080/summary
          template: |
            <div class="domum-fleet-grid">
            {{ range .JSON.Array "systems" }}
              <div class="domum-host-card">
                <div class="domum-host-topline">
                  <div class="domum-host-name">{{ .String "label" }}</div>
                  <div class="domum-host-status domum-host-status-{{ .String "status" }}">{{ .String "status" }}</div>
                </div>
                <div class="domum-host-meta">
                  {{ if .Bool "stale" }}Stale data; check Beszel.{{ else }}Fresh summary from Beszel.{{ end }}
                </div>
              </div>
            {{ end }}
            </div>

        - type: monitor
          title: Automation dependencies
          style: compact
          cache: 1m
          sites:
            - title: Zigbee2MQTT
              url: https://z2m.${DOMUM_DOMAIN}
              check-url: http://zigbee2mqtt:8080
              icon: si:zigbee
            - title: Node-RED
              url: https://nodered.${DOMUM_DOMAIN}
              check-url: http://nodered:1880
              icon: si:nodered
            - title: ESPHome
              url: https://esphome.${DOMUM_DOMAIN}
              check-url: http://esphome:6052
              icon: si:esphome

        - type: releases
          title: Hosting software releases
          cache: 6h
          limit: 10
          collapse-after: 6
          show-source-icon: true
          repositories:
            - glanceapp/glance
            - traefik/traefik
            - gethomepage/homepage
            - henrygd/beszel
            - healthchecks/healthchecks
            - linuxserver/docker-speedtest-tracker
