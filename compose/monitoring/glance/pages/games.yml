- name: Games
  slug: games
  width: wide
  head-widgets:
    - type: html
      source: |
        <section class="domum-page-hero">
          <div>
            <div class="domum-kicker">Play queue</div>
            <h1>Games Desk</h1>
            <p>Public gaming news, design videos, and store links while Steam/Twitch account integrations stay opt-in.</p>
          </div>
          <div class="domum-hero-badges">
            <span>No Steam login</span>
            <span>No Twitch token</span>
            <span>Public sources</span>
          </div>
        </section>
  columns:
    - size: full
      widgets:
        - type: videos
          title: Game design and analysis
          style: horizontal-cards
          cache: 1h
          limit: 10
          collapse-after: 5
          include-shorts: false
          channels:
            - UCqJ-Xo29CKyLTjn6z2XwYAw # Game Maker's Toolkit
            - UC0fDG3byEcMtbOqPMymDNbw # Noclip
            - UC9PBzalIcEQCsiIkq36PyUA # Digital Foundry
            - UCNvzD7Z-g64bPXxGzaQaa4g # gameranx

        - type: custom-api
          title: Steam Specials
          cache: 1h
          url: https://store.steampowered.com/api/featuredcategories?cc=us
          template: |
            <ul class="list list-gap-10 collapsible-container" data-collapse-after="6">
            {{ range .JSON.Array "specials.items" }}
              <li>
                <a class="size-h4 color-highlight block text-truncate" href="https://store.steampowered.com/app/{{ .Int "id" }}/" target="_blank" rel="noreferrer">{{ .String "name" }}</a>
                <ul class="list-horizontal-text">
                  <li>{{ div (.Int "final_price" | toFloat) 100 | printf "$%.2f" }}</li>
                  {{ $discount := .Int "discount_percent" }}
                  <li{{ if ge $discount 40 }} class="color-positive"{{ end }}>{{ $discount }}% off</li>
                </ul>
              </li>
            {{ end }}
            </ul>

        - type: split-column
          widgets:
            - type: rss
              title: Gaming headlines
              style: detailed-list
              cache: 30m
              limit: 12
              collapse-after: 6
              feeds:
                - url: https://feeds.ign.com/ign/games-all
                  title: IGN Games
                - url: https://www.polygon.com/rss/index.xml
                  title: Polygon
                - url: https://www.eurogamer.net/feed
                  title: Eurogamer

            - type: rss
              title: PC and indie watch
              style: detailed-list
              cache: 45m
              limit: 12
              collapse-after: 6
              feeds:
                - url: https://www.rockpapershotgun.com/feed
                  title: Rock Paper Shotgun
                - url: https://www.pcgamer.com/rss/
                  title: PC Gamer
                - url: https://itch.io/games/newest.xml
                  title: itch.io Newest

    - size: small
      widgets:
        - type: html
          source: |
            <div class="domum-side-panel">
              <div class="domum-kicker">Account boundary</div>
              <h2>Public mode</h2>
              <p>Steam profile, wishlist, friends, and Twitch API data stay disabled until credentials and allowed fields are approved.</p>
              <div class="domum-status-list">
                <span>No friends list</span>
                <span>No wishlist</span>
                <span>No play history</span>
              </div>
            </div>

        - type: bookmarks
          title: Open directly
          groups:
            - title: Stores
              links:
                - title: Steam
                  url: https://store.steampowered.com/
                - title: Steam Specials
                  url: https://store.steampowered.com/specials/
                - title: Epic Games Store
                  url: https://store.epicgames.com/
                - title: GOG
                  url: https://www.gog.com/
                - title: itch.io
                  url: https://itch.io/
            - title: Watch
              links:
                - title: Twitch Games
                  url: https://www.twitch.tv/directory
                - title: YouTube Gaming
                  url: https://www.youtube.com/gaming
