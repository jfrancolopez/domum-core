- name: Network
  slug: network
  width: wide
  columns:
    - size: small
      widgets:
        - type: bookmarks
          title: Investigate
          groups:
            - title: Specialist UIs
              links:
                - title: Speedtest Tracker
                  url: https://speedtest.${DOMUM_DOMAIN}
                - title: AdGuard Home
                  url: https://dns.${DOMUM_DOMAIN}

    - size: full
      widgets:
        - type: custom-api
          title: Latest WAN test
          cache: 5m
          url: http://speedtest-tracker/api/v1/results/latest
          headers:
            Authorization: Bearer ${GLANCE_SPEEDTEST_TRACKER_TOKEN}
          template: |
            <div class="flex flex-column gap-10">
              <div class="flex items-center justify-between">
                <div>
                  <div class="size-h3">Speedtest Tracker</div>
                  <div class="color-subdue size-sm">Latest scheduled result</div>
                </div>
                <a class="size-sm color-primary" href="https://speedtest.${DOMUM_DOMAIN}" target="_blank" rel="noreferrer">Open</a>
              </div>
              <div class="cards-grid gap-10" style="--columns-per-row: 4;">
                <div class="card padding-block-10 padding-inline-12">
                  <div class="size-sm color-subdue">Download</div>
                  <div class="size-h3 color-highlight">{{ .data.download }} Mbps</div>
                </div>
                <div class="card padding-block-10 padding-inline-12">
                  <div class="size-sm color-subdue">Upload</div>
                  <div class="size-h3 color-highlight">{{ .data.upload }} Mbps</div>
                </div>
                <div class="card padding-block-10 padding-inline-12">
                  <div class="size-sm color-subdue">Ping</div>
                  <div class="size-h3">{{ .data.ping }} ms</div>
                </div>
                <div class="card padding-block-10 padding-inline-12">
                  <div class="size-sm color-subdue">Jitter</div>
                  <div class="size-h3">{{ .data.jitter }} ms</div>
                </div>
              </div>
              <div class="size-sm color-subdue">Packet loss: {{ .data.packetLoss }}%; measured {{ .data.createdAt }}</div>
            </div>

        - type: monitor
          title: Network service reachability
          style: compact
          cache: 1m
          sites:
            - title: Speedtest Tracker
              url: https://speedtest.${DOMUM_DOMAIN}
              check-url: http://speedtest-tracker/api/healthcheck
              icon: si:speedtest
            - title: AdGuard Home
              url: https://dns.${DOMUM_DOMAIN}
              check-url: https://dns.${DOMUM_DOMAIN}
              icon: si:adguard
            - title: Traefik edge
              url: https://dash.${DOMUM_DOMAIN}
              check-url: http://glance:8080
              icon: si:traefikproxy

        - type: dns-stats
          title: DNS filtering
          service: adguard
          cache: 5m
          url: https://dns.${DOMUM_DOMAIN}/
          username: ${GLANCE_ADGUARD_USERNAME}
          password: ${GLANCE_ADGUARD_PASSWORD}
          hide-top-domains: true
