- name: Network
  slug: network
  width: wide
  show-mobile-header: true
  head-widgets:
    - type: html
      source: |
        <section class="domum-page-hero domum-network-hero">
          <div>
            <div class="domum-kicker">Private network operations</div>
            <h1>Network Command</h1>
            <p>WAN quality, DNS filtering, and trusted edge reachability in one operator view.</p>
          </div>
          <div class="domum-hero-badges">
            <span>LAN + Tailscale</span>
            <span>Read-only sources</span>
            <span>No client identities</span>
          </div>
        </section>
  columns:
    - size: full
      widgets:
        - type: custom-api
          title: WAN pulse
          css-class: domum-wan-pulse
          hide-header: true
          cache: 5m
          url: http://speedtest-tracker/api/v1/results/latest
          headers:
            Authorization: Bearer ${GLANCE_SPEEDTEST_TRACKER_TOKEN}
            Accept: application/json
          template: |
            {{ if eq .Response.StatusCode 200 }}
            <div class="domum-wan-card">
              <div class="domum-wan-topline">
                <div>
                  <div class="domum-kicker">Speedtest Tracker</div>
                  <div class="domum-wan-title">WAN pulse</div>
                  <div class="domum-wan-subtitle">Latest scheduled test from the private network</div>
                </div>
                <a class="domum-pill-link" href="https://speedtest.${DOMUM_DOMAIN}" target="_blank" rel="noreferrer">Open source</a>
              </div>
              <div class="domum-metric-grid">
                <div class="domum-metric-card domum-metric-card-primary">
                  <span>Download</span>
                  <strong>{{ .JSON.String "data.download_bits_human" }}</strong>
                  <small>toward the home</small>
                </div>
                <div class="domum-metric-card domum-metric-card-secondary">
                  <span>Upload</span>
                  <strong>{{ .JSON.String "data.upload_bits_human" }}</strong>
                  <small>from the home</small>
                </div>
                <div class="domum-metric-card">
                  <span>Ping</span>
                  <strong>{{ .JSON.Float "data.ping" | printf "%.1f" }} ms</strong>
                  <small>round trip</small>
                </div>
                <div class="domum-metric-card">
                  <span>Jitter</span>
                  <strong>{{ .JSON.Float "data.ping.jitter" | printf "%.1f" }} ms</strong>
                  <small>stability</small>
                </div>
              </div>
              <div class="domum-wan-footer">
                <span>Packet loss: {{ .JSON.Float "data.packetLoss" | printf "%.1f" }}%</span>
                <span>Measured: {{ .JSON.String "data.created_at" }}</span>
              </div>
            </div>
            {{ else }}
            <div class="domum-state-card"><strong>Speedtest unavailable</strong><span>{{ .Response.Status }}</span></div>
            {{ end }}

        - type: split-column
          widgets:
            - type: custom-api
              title: UniFi health
              cache: 5m
              url: ${GLANCE_UNIFI_API_URL}
              headers:
                ${GLANCE_UNIFI_API_HEADER}: ${GLANCE_UNIFI_API_KEY}
              template: |
                {{ if eq .Response.StatusCode 200 }}
                <div class="domum-unifi-grid">
                {{ range $index, $subsystem := .JSON.Array "data" }}
                {{ if lt $index 6 }}
                  <div class="domum-unifi-card domum-unifi-card-{{ $subsystem.String "status" }}">
                    <div class="domum-unifi-topline">
                      <strong>{{ $subsystem.String "subsystem" }}</strong>
                      <span>{{ $subsystem.String "status" }}</span>
                    </div>
                    <div class="domum-unifi-counts">
                      <span>Users <b>{{ $subsystem.Int "num_user" }}</b></span>
                      <span>APs <b>{{ $subsystem.Int "num_ap" }}</b></span>
                      <span>Down <b>{{ $subsystem.Int "num_disconnected" }}</b></span>
                    </div>
                  </div>
                {{ end }}
                {{ end }}
                </div>
                {{ else }}
                <div class="domum-state-card"><strong>UniFi unavailable</strong><span>{{ .Response.Status }}</span></div>
                {{ end }}

            - type: monitor
              title: Edge reachability
              style: compact
              cache: 1m
              sites:
                - title: Speedtest Tracker
                  url: https://speedtest.${DOMUM_DOMAIN}
                  check-url: http://speedtest-tracker/api/healthcheck
                  icon: si:speedtest
                - title: AdGuard Home
                  url: https://dns.${DOMUM_DOMAIN}
                  check-url: https://dns.${DOMUM_DOMAIN}
                  icon: si:adguard
                - title: Glance service
                  url: https://dash.${DOMUM_DOMAIN}
                  check-url: http://glance:8080
                  icon: si:traefikproxy

            - type: dns-stats
              title: DNS filtering
              service: adguard
              cache: 5m
              url: https://dns.${DOMUM_DOMAIN}/
              username: ${GLANCE_ADGUARD_USERNAME}
              password: ${GLANCE_ADGUARD_PASSWORD}
              hide-top-domains: true

    - size: small
      widgets:
        - type: html
          source: |
            <div class="domum-side-panel">
              <div class="domum-kicker">Source policy</div>
              <h2>Safe by design</h2>
              <p>Useful signals only: no client names, raw DNS history, SSIDs, MACs, or topology maps.</p>
              <div class="domum-status-list">
                <span>Speedtest: latest result</span>
                <span>AdGuard: aggregate only</span>
                <span>UniFi: aggregate health only</span>
              </div>
            </div>

        - type: bookmarks
          title: Investigate
          groups:
            - title: Specialist UIs
              links:
                - title: Speedtest Tracker
                  url: https://speedtest.${DOMUM_DOMAIN}
                - title: AdGuard Home
                  url: https://dns.${DOMUM_DOMAIN}
