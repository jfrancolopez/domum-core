# Network Dashboard Page Configuration

version: "1"
title: "Network"
description: "Comprehensive network monitoring dashboard"
layout:
  - 
    - public-ip
    - wan-status
    - gateway-uptime
  - 
    - speedtest-history
    - unifi-monitor
    - adguard-dns
  - 
    - tailscale-status
    - alerts-latency

widgets:
  # Public IP and ISP Information
  - id: public-ip
    title: "Public IP"
    type: "network/public-ip"  
    refresh: 1h
    privacy: "public"

  # WAN State Monitoring  
  - id: wan-status
    title: "WAN Status"
    type: "network/wan-status"
    refresh: 1m
    privacy: "public"
    
  # Gateway Uptime Tracking
  - id: gateway-uptime
    title: "Gateway Uptime"
    type: "network/gateway-uptime"
    refresh: 5m 
    privacy: "public"

  # Speedtest History and Performance Metrics
  - id: speedtest-history
    title: "Speedtests"
    type: "network/speedtest-history"
    refresh: 5m
    privacy: "public"

  # UniFi Device Monitoring  
  - id: unifi-monitor
    title: "UniFi Devices"
    type: "network/unifi-monitor"
    refresh: 5m
    privacy: "private"

  # AdGuard DNS Statistics
  - id: adguard-dns
    title: "DNS Stats"
    type: "network/adguard-dns"  
    refresh: 1m
    privacy: "private"

  # Tailscale Device Status
  - id: tailscale-status
    title: "Tailscale Devices"
    type: "network/tailscale-status"
    refresh: 5m
    privacy: "private"

  # Network Alerts and Latency Monitoring  
  - id: alerts-latency
    title: "Network Alerts"
    type: "network/alerts-latency"
    refresh: 1m
    privacy: "public"