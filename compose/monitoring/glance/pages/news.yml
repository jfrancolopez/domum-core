- name: News
  slug: news
  width: wide
  show-mobile-header: true
  head-widgets:
    - type: html
      source: |
        <section class="domum-page-hero">
          <div>
            <div class="domum-kicker">Signal over noise</div>
            <h1>News Desk</h1>
            <p>Top home-tech, world, business, science, and security feeds without logging into another platform.</p>
          </div>
          <div class="domum-hero-badges">
            <span>RSS only</span>
            <span>Editable sources</span>
            <span>No tracking widgets</span>
          </div>
        </section>
  columns:
    - size: full
      widgets:
        - type: split-column
          widgets:
            - type: rss
              title: Top stories
              style: detailed-list
              cache: 20m
              limit: 12
              collapse-after: 6
              feeds:
                - url: https://feeds.bbci.co.uk/news/world/rss.xml
                  title: BBC World
                - url: https://www.npr.org/rss/rss.php?id=1001
                  title: NPR News
                - url: https://www.theguardian.com/us-news/rss
                  title: Guardian US

            - type: rss
              title: Business and markets
              style: detailed-list
              cache: 30m
              limit: 10
              collapse-after: 5
              feeds:
                - url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
                  title: WSJ Markets
                - url: https://www.cnbc.com/id/100003114/device/rss/rss.html
                  title: CNBC Economy
                - url: https://www.ft.com/rss/home/us
                  title: Financial Times

        - type: split-column
          widgets:
            - type: rss
              title: Technology and AI
              style: detailed-list
              cache: 30m
              limit: 12
              collapse-after: 6
              feeds:
                - url: https://feeds.arstechnica.com/arstechnica/technology-lab
                  title: Ars Technica
                - url: https://www.theverge.com/rss/index.xml
                  title: The Verge
                - url: https://simonwillison.net/atom/everything/
                  title: Simon Willison

            - type: rss
              title: Science and space
              style: detailed-list
              cache: 45m
              limit: 10
              collapse-after: 5
              feeds:
                - url: https://www.nasa.gov/rss/dyn/breaking_news.rss
                  title: NASA
                - url: https://www.scientificamerican.com/feed/
                  title: Scientific American
                - url: https://www.quantamagazine.org/feed/
                  title: Quanta

    - size: small
      widgets:
        - type: html
          source: |
            <div class="domum-side-panel">
              <div class="domum-kicker">Editorial policy</div>
              <h2>Broad first pass</h2>
              <p>These are plain RSS sources grouped by daily-use categories. Remove noisy feeds directly from this page file.</p>
              <div class="domum-status-list">
                <span>World</span>
                <span>Markets</span>
                <span>Tech + AI</span>
                <span>Science</span>
              </div>
            </div>

        - type: rss
          title: Security watch
          style: vertical-list
          cache: 45m
          limit: 8
          collapse-after: 5
          feeds:
            - url: https://www.cisa.gov/news.xml
              title: CISA
            - url: https://krebsonsecurity.com/feed/
              title: Krebs
            - url: https://www.schneier.com/feed/atom/
              title: Schneier
