server:
  proxied: true
  assets-path: /app/config/assets

branding:
  app-name: Domum Core
  logo-text: Domum-Core
  logo-url: /assets/domum-core-logo.svg
  favicon-url: /assets/domum-core-icon.svg
  app-icon-url: /assets/domum-core-icon.svg
  app-background-color: "#12131f"

theme:
  background-color: 226 24 9
  primary-color: 205 92 62
  positive-color: 150 70 50
  negative-color: 2 78 62
  contrast-multiplier: 1.28
  text-saturation-multiplier: 1.08
  custom-css-file: /assets/domum.css
  presets:
    catppuccin-macchiato:
      background-color: 232 23 18
      primary-color: 220 83 75
      positive-color: 105 48 72
      negative-color: 351 74 73
      contrast-multiplier: 1.2
    gruvbox-dark:
      background-color: 0 0 16
      primary-color: 43 59 81
      positive-color: 61 66 44
      negative-color: 6 96 59

pages:
  - $include: pages/home.yml
  - $include: pages/hosting.yml
  - $include: pages/network.yml
  - $include: pages/media.yml
  - $include: pages/games.yml
  - $include: pages/news.yml
  - $include: pages/social.yml
  - $include: pages/technology.yml
