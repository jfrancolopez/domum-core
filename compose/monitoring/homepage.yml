services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    networks:
      - domum-proxy
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.${DOMUM_DOMAIN},homepage.${DOMUM_DOMAIN},portal-preview.${DOMUM_DOMAIN}
      - HOMEPAGE_VAR_DOMUM_DOMAIN=${DOMUM_DOMAIN}
      - LOG_TARGETS=stdout
    volumes:
      - /opt/domum-core/compose/monitoring/homepage:/app/config:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=domum-proxy
      - traefik.http.routers.homepage.rule=Host(`homepage.${DOMUM_DOMAIN}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls=true
      - traefik.http.routers.homepage.tls.certresolver=cf
      - traefik.http.routers.homepage.middlewares=securityHeaders@file
      - traefik.http.services.homepage.loadbalancer.server.port=3000
      - traefik.http.routers.home.rule=Host(`home.${DOMUM_DOMAIN}`)
      - traefik.http.routers.home.entrypoints=websecure
      - traefik.http.routers.home.tls=true
      - traefik.http.routers.home.tls.certresolver=cf
      - traefik.http.routers.home.middlewares=securityHeaders@file
      - traefik.http.routers.home.service=homepage
      - traefik.http.routers.homepage-preview.rule=Host(`portal-preview.${DOMUM_DOMAIN}`)
      - traefik.http.routers.homepage-preview.entrypoints=websecure
      - traefik.http.routers.homepage-preview.tls=true
      - traefik.http.routers.homepage-preview.tls.certresolver=cf
      - traefik.http.routers.homepage-preview.middlewares=securityHeaders@file
      - traefik.http.routers.homepage-preview.service=homepage
    profiles:
      - core

networks:
  domum-proxy:
    external: true
