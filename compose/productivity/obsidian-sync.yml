services:
  # Self-hosted Obsidian sync backend for the obsidian-livesync community
  # plugin. CouchDB is the storage engine the plugin replicates against —
  # real-time, works across desktop + mobile, and the most widely used
  # self-hosted option. See docs/services/obsidian-sync.md for why this was chosen.
  obsidian-sync:
    image: docker.io/couchdb:3
    container_name: obsidian-sync
    restart: unless-stopped
    networks:
      - domum-data
      - domum-proxy
    environment:
      - TZ=America/New_York
      - COUCHDB_USER=${OBSIDIAN_COUCHDB_USER:-obsidian}
      # Set OBSIDIAN_COUCHDB_PASSWORD in config; never commit a real password.
      - COUCHDB_PASSWORD=${OBSIDIAN_COUCHDB_PASSWORD:-changeme}
    volumes:
      - /opt/domum-core/compose/productivity/obsidian-sync/data:/opt/couchdb/data
      # Writable runtime config dir for CouchDB-generated docker.ini/admin hashes.
      - /opt/domum-core/compose/productivity/obsidian-sync/etc:/opt/couchdb/etc/local.d
    labels:
      - traefik.enable=true
      - traefik.docker.network=domum-proxy
      - traefik.http.routers.obsidian.rule=Host(`${OBSIDIAN_DOMAIN:-obsidian.${DOMUM_DOMAIN}}`)
      - traefik.http.routers.obsidian.entrypoints=websecure
      - traefik.http.routers.obsidian.tls=true
      - traefik.http.routers.obsidian.tls.certresolver=cf
      - traefik.http.routers.obsidian.middlewares=forwardedHeaders@file
      - traefik.http.services.obsidian.loadbalancer.server.port=5984
    profiles:
      - core

networks:
  domum-proxy:
    external: true
  domum-data:
    external: true
