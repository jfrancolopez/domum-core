services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    restart: unless-stopped
    depends_on:
      - karakeep-chrome
      - karakeep-meilisearch
    networks:
      - domum-proxy
      - domum-data
    env_file:
      - path: /etc/domum-core/secrets/karakeep.env
        required: false
    environment:
      - DATA_DIR=/data
      - NEXTAUTH_URL=https://karakeep.${DOMUM_DOMAIN}
      - MEILI_ADDR=http://karakeep-meilisearch:7700
      - BROWSER_WEB_URL=http://karakeep-chrome:9222
      - DB_WAL_MODE=true
      - LOG_LEVEL=info
      - DISABLE_NEW_RELEASE_CHECK=true
    volumes:
      - /opt/domum-core/compose/productivity/karakeep/data:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=domum-proxy
      - traefik.http.routers.karakeep.rule=Host(`karakeep.${DOMUM_DOMAIN}`)
      - traefik.http.routers.karakeep.entrypoints=websecure
      - traefik.http.routers.karakeep.tls=true
      - traefik.http.routers.karakeep.tls.certresolver=cf
      - traefik.http.routers.karakeep.middlewares=securityHeaders@file,forwardedHeaders@file
      - traefik.http.services.karakeep.loadbalancer.server.port=3000
    profiles:
      - core

  karakeep-chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    container_name: karakeep-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    networks:
      - domum-data
    profiles:
      - core

  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.41.0
    container_name: karakeep-meilisearch
    restart: unless-stopped
    networks:
      - domum-data
    env_file:
      - path: /etc/domum-core/secrets/karakeep.env
        required: false
    environment:
      - MEILI_NO_ANALYTICS=true
    volumes:
      - /opt/domum-core/compose/productivity/karakeep/meilisearch:/meili_data
    profiles:
      - core

networks:
  domum-proxy:
    external: true
  domum-data:
    external: true
