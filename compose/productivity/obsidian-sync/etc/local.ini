; CouchDB tuning required by the obsidian-livesync plugin.
; See docs/services/obsidian-sync.md. The admin user/password come from the container
; environment (COUCHDB_USER / COUCHDB_PASSWORD); do not duplicate them here.

[couchdb]
single_node = true
max_document_size = 50000000
uuid = dbb1babd6e426bb1ff6e1c66f8efca72

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600

[admins]
obsidian = -pbkdf2:sha256-2fa98db249ff900190bf855e73622cbf3036d1c387a5c8bb787a9a892695d93d,9f5414b7019150bbbbe451dc23fcc501,600000
