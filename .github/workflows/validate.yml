name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yml .

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: bash -n bin/domum bin/domum-core bin/domum-core-backup install.sh
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          additional_files: "domum domum-core domum-core-backup"
          ignore_paths: "nimbalyst-local .claude backups"

  smoke-tests:
    name: smoke-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/catalog-consistency-smoke.sh

  adapter-tests:
    name: adapter-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/glance-beszel-adapter-test.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  compose-validate:
    name: compose-validate
    runs-on: ubuntu-latest
    env:
      DOMUM_DOMAIN: example.com
      DOMUM_EMAIL: ci@example.com
      DOMUM_LAN_IP: 127.0.0.1
      DOMUM_GLANCE_LAN_CIDR: 192.0.2.0/24
      DOMUM_TS_IP: 127.0.0.1
      GLANCE_IMAGE: glanceapp/glance:v0.8.5
      ADGUARD_WEB_PORT: 3000
      CF_DNS_API_TOKEN: ci-dummy
      DOMUM_MARIADB_ENV_FILE: ${{ github.workspace }}/.ci/mariadb.env
      DOMUM_SPEEDTEST_ENV_FILE: ${{ github.workspace }}/.ci/speedtest-tracker.env
    steps:
      - uses: actions/checkout@v4
      - name: Render with all services enabled
        run: |
          set -euo pipefail
          mkdir -p .ci
          touch "$DOMUM_MARIADB_ENV_FILE"
          cp config/speedtest-tracker.env.example "$DOMUM_SPEEDTEST_ENV_FILE"

          files=(-f compose/base.yml)
          while IFS= read -r -d '' f; do
            case "$f" in
              compose/proxy/traefik/*|compose/monitoring/glance/*) continue ;;
            esac
            files+=(-f "$f")
          done < <(git ls-files -z 'compose/**/*.yml' | sort -z)
          echo "Validating: ${files[*]}"
          docker compose "${files[@]}" --profile core config --no-env-resolution -q

  glance-validate:
    name: glance-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/glance-config-validate.sh
