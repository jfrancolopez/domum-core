extends: default

rules:
  line-length:
    level: warning
    max: 200
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on", "off"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent

ignore: |
  nimbalyst-local/
  .claude/
  compose/automation/home-assistant/blueprints/
  compose/automation/home-assistant/custom_components/
  compose/automation/home-assistant/secrets.yaml
  compose/automation/zigbee2mqtt/secret.yaml
  compose/automation/zigbee2mqtt/secret.yaml.pre-mqtt-init
  compose/networking/adguard/conf/
  compose/networking/adguard/work/
